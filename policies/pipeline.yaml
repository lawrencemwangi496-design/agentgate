name: pipeline
description: "CI/CD and automation pipeline policy — named action templates only, arbitrary command execution disabled"
guardrails: true
allow: []
deny: []
rules: []
actions:
  deploy:
    description: "Pull latest git changes and restart service"
    steps:
      - "/usr/bin/git -C /var/www/site pull --ff-only"
      - "/usr/bin/systemctl reload nginx"
    stop_on_failure: true
  test:
    description: "Run automated health test"
    steps:
      - "/usr/bin/curl -f http://127.0.0.1:7991/health"
    stop_on_failure: true
