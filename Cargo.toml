[package]
name = "agentgate"
version = "0.1.1"
edition = "2024"
description = "Secure bridge that lets AI agents execute commands on your machine without your password"
license = "MIT"

[[bin]]
name = "agentgate"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# HTTP server & client
axum = { version = "0.8", features = ["json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }

# TLS
rustls = "0.23"
rcgen = "0.13"
tokio-rustls = "0.26"
rustls-pemfile = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Security
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc
anyhow = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
glob-match = "0.2"
tabled = "0.17"
shlex = "1.3"
subtle = "2.6"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
