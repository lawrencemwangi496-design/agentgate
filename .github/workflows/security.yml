name: Security & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  checks: write

jobs:
  security-checks:
    name: Security Audits & Lints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify Compilation (cargo check)
        run: cargo check --verbose

      - name: Security Linter (cargo clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Security Test Suite
        run: cargo test --verbose

      - name: Install Prebuilt cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Cargo Security Audit
        run: cargo audit --ignore RUSTSEC-2024-0320

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
